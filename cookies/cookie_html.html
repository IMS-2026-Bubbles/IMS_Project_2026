

<!DOCTYPE html>
<!-- //FROM geeksforgeeks https://www.geeksforgeeks.org/javascript/how-to-create-cookie-consent-box-using-html-css-and-javascript/
 -->
 <html lang="en">

<head>
    <meta charset="UTF-8">
    <title>
          Cookie Consent Box using HTML CSS & JavaScript
      </title>
    <link rel="stylesheet"
          href="../assets/style.css">
</head>

<body>
    <div id="consentBox" class="cookie_banner">
        <div id="consentContent">
            <header id="consentHeader">
                  Cookies: The choice is yours
              </header>
            <p>
              We use cookies to make our site work well
              for you and so we can continually improve it.
              <br>The cookies that are necessary to 
              keep the site functioning are always on
            </p>
            <div class="buttons">
                <button class="scriba_input consentButton">
                      Accept Cookies
                  </button>
                <button class="scriba_input rejectButton">
                      Reject
                  </button>
            </div>
        </div>
    </div>
    <script src="../cookies/cookie_script.js"></script>
</body>

</html>
